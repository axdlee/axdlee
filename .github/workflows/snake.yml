# 🐍 贡献蛇形动画 - 自动生成贡献图 SVG
# 每天 UTC 00:17 自动更新，也可手动触发
# 仓库: https://github.com/Platane/snk

name: Generate Snake Animation

on:
  schedule:
    - cron: "17 0 * * *"  # 每天 UTC 00:17
  workflow_dispatch:       # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: axdlee
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=green&color_dots=#0D1117,#00FF41,#00D4FF,#7B2FFF&theme=dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
