name: Generate Snake Animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: axdlee
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=green&color_dots=#161B22,#39D353,#26A641,#0E4429&theme=dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
